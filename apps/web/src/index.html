<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>Convertible</title>
  <meta name="description" content="Convert files privately and offline. Nothing is uploaded: every conversion runs on your device.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0D0F16">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/brand/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/brand/icons/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="assets/brand/icons/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Convertible">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="preload" href="assets/fonts/Inter-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/Inter-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="assets/brand/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="intro" class="intro" aria-hidden="true"></div>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="./" aria-label="Convertible, home">
      <span id="brand-mark"></span>
      <span class="brand-name">Convertible</span>
    </a>
    <nav class="topnav" aria-label="App">
      <button type="button" id="install" class="btn btn-ghost btn-small" data-testid="install" hidden>
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
        <span>Install</span>
      </button>
      <button type="button" id="open-formats" class="btn btn-ghost btn-small" data-testid="open-formats">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v7H4z"/><path d="M13 4h7v7h-7z"/><path d="M4 13h7v7H4z"/><path d="M13 13h7v7h-7z"/></svg>
        <span class="topnav-label">Formats</span>
      </button>
      <button type="button" id="open-settings" class="btn btn-ghost btn-small" data-testid="open-settings">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10"/><path d="M18 7h2"/><path d="M4 17h4"/><path d="M12 17h8"/><path d="M16 5v4"/><path d="M10 15v4"/></svg>
        <span class="topnav-label">Settings</span>
      </button>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <section class="home" aria-labelledby="home-title">
      <div class="dropzone" data-testid="dropzone">
        <span id="hero-mark"></span>
        <h1 id="home-title" class="hero-title">Convert files, privately.</h1>
        <p class="hero-sub">Drop files or folders anywhere, paste, or choose them. <span class="hero-count"><span id="format-count">Many</span> formats, all on this device.</span></p>
        <div class="hero-actions">
          <button type="button" id="choose-files" class="btn btn-primary btn-large" data-testid="choose-files">
            <svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            <span>Choose files</span>
          </button>
          <button type="button" id="choose-folder" class="btn btn-ghost btn-large" data-testid="choose-folder">
            <svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span>Choose a folder</span>
          </button>
        </div>
        <div id="core-status" class="core-status" role="status" aria-live="polite" data-testid="core-status" hidden></div>
        <p class="privacy-line" data-testid="privacy-statement">
          <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12v9H6z"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg>
          <span><strong>Files never leave your device.</strong> No uploads, no accounts, works offline.</span>
        </p>
        <input type="file" id="file-input" multiple hidden data-testid="file-input">
        <input type="file" id="folder-input" webkitdirectory multiple hidden data-testid="folder-input">
      </div>
    </section>

    <section id="queue" class="queue" aria-labelledby="queue-title" hidden>
      <div class="queue-bar">
        <div class="queue-heading">
          <h2 id="queue-title" class="queue-title">Your files <span id="queue-count" class="queue-count"></span></h2>
          <div class="queue-actions">
            <button type="button" id="add-more" class="btn btn-ghost btn-small" data-testid="add-more">
              <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
              <span>Add</span>
            </button>
            <button type="button" id="clear-all" class="btn btn-ghost btn-small" data-testid="clear-all"><span>Clear</span></button>
            <button type="button" id="cancel-all" class="btn btn-ghost btn-small" data-testid="cancel-all" hidden><span>Cancel all</span></button>
            <button type="button" id="save-all" class="btn btn-secondary btn-small" data-testid="save-all" hidden><span>Save all</span></button>
            <button type="button" id="convert-all" class="btn btn-primary btn-small" data-testid="convert-all" hidden><span>Convert</span></button>
          </div>
        </div>
        <div id="bulk" class="bulk"></div>
        <div id="overall" class="overall" role="progressbar" aria-label="Overall progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden></div>
      </div>
      <ol id="cards" class="cards" aria-label="Files"></ol>
    </section>
  </main>

  <footer class="footer">
    <p>Open source · No network · <span id="app-version"></span> · <span id="core-version"></span></p>
  </footer>

  <div id="drop-overlay" class="drop-overlay" hidden>
    <div class="drop-card">
      <svg class="icon" viewBox="0 0 24 24" width="40" height="40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
      <p>Drop to add files</p>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="noscript">Convertible needs JavaScript and WebAssembly to convert files on your device.</p></noscript>
</body>
</html>
