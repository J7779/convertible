<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100">
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/><feOffset in="b" dx="4" dy="4" result="o"/><feFlood flood-color="#000" flood-opacity="0.5"/><feComposite in2="o" operator="in" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="grey"><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect x="10" y="20" width="50" height="50" fill="#36c" filter="url(#blur)"/>
  <rect x="75" y="20" width="50" height="50" fill="#c63" filter="url(#shadow)"/>
  <circle cx="165" cy="45" r="25" fill="#e22" filter="url(#grey)"/>
</svg>
