# Deploys the web app (apps/web/dist) to GitHub Pages. Manual only.
#
# Prerequisite, once: repository Settings > Pages > Build and deployment > Source:
# "GitHub Actions". Until then the first step stops with an explanation instead of failing
# somewhere inside the deployment.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      pages: read
    env:
      CVT_DOCKER_MEMORY: 12g
      CVT_JOBS: "4"
    steps:
      - name: Check that GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null)"; then
            echo "::error title=GitHub Pages is not enabled::Enable it first: Settings > Pages > Build and deployment > Source: GitHub Actions. Then run this workflow again."
            exit 1
          fi
          if [[ "${build_type}" != "workflow" ]]; then
            echo "::error title=GitHub Pages uses '${build_type}'::Set Settings > Pages > Build and deployment > Source to 'GitHub Actions', then run this workflow again."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build (pinned Emscripten container)
        run: apps/web/build.sh --docker
      - name: Unit tests
        run: apps/web/test.sh
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
