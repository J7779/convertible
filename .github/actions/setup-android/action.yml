# Prepares a GitHub-hosted Ubuntu runner for building apps/android: JDK 17, the SDK
# packages apps/android/README.md asks for (installed with the runner's own sdkmanager)
# and a Gradle cache keyed on the build scripts and the version catalogue.
name: Set up Android build
description: JDK, Android SDK packages and Gradle cache for apps/android

inputs:
  emulator:
    description: Also install the emulator and the x86_64 system image (instrumented tests)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: JDK 17 (Temurin)
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: "17"

    - name: Gradle cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/gradle/wrapper/gradle-wrapper.properties', 'apps/android/gradle/libs.versions.toml', 'apps/android/**/*.gradle.kts', 'apps/android/gradle.properties') }}
        restore-keys: gradle-${{ runner.os }}-

    - name: Android SDK packages
      shell: bash
      run: |
        set -euo pipefail
        sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
        yes | "${sdkmanager}" --licenses >/dev/null || true
        "${sdkmanager}" --install "platforms;android-37.0" "build-tools;37.0.0" \
          "ndk;27.1.12297006" "cmake;3.22.1" "platform-tools" >/dev/null
        echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "${GITHUB_ENV}"

    - name: Emulator and system image
      if: inputs.emulator == 'true'
      shell: bash
      run: tools/ci/android-emulator.sh install
