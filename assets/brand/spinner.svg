<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="cv-spin-title">
  <title id="cv-spin-title">Converting</title>
  <defs>
    <linearGradient id="cv-spin-flux" gradientUnits="userSpaceOnUse" x1="0" y1="360" x2="0" y2="664">
      <stop offset="0" stop-color="#7C6CFF"/>
      <stop offset="0.5" stop-color="#D662B0"/>
      <stop offset="1" stop-color="#FF6452"/>
    </linearGradient>
  </defs>
  <style>
    /* Indeterminate spinner, 1400 ms loop. Storyboard: animation.json */
    .cv-stroke { fill: none; stroke: url(#cv-spin-flux); stroke-width: 200; stroke-linecap: butt; stroke-linejoin: miter; }
    .cv-track { opacity: 0.16; }
    .cv-runner { stroke-dasharray: 1000 1000; }
    .cv-runner { animation: cv-spin-runner-trim 1400ms infinite both; }
    .cv-seed { transform-origin: 772px 260px; animation: cv-spin-seed-transform 1400ms infinite both; }
    @keyframes cv-spin-runner-trim {
      0% { stroke-dasharray: 0 1000; stroke-dashoffset: 0; animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
      45% { stroke-dasharray: 1000 1000; stroke-dashoffset: 0; }
      55% { stroke-dasharray: 1000 1000; stroke-dashoffset: 0; animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
      100% { stroke-dasharray: 0 1000; stroke-dashoffset: -1000; }
    }
    @keyframes cv-spin-seed-transform {
      0% { transform: scale(0); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
      16% { transform: scale(1); }
      55% { transform: scale(1); animation-timing-function: cubic-bezier(0.7, 0, 0.84, 0); }
      70% { transform: scale(0); }
      100% { transform: scale(0); }
    }
    @keyframes cv-spin-pulse {
      0% { opacity: 1; animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
      50% { opacity: 0.45; animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
      100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cv-runner, .cv-seed { animation: cv-spin-pulse 1600ms infinite; }
    }
  </style>
  <g class="cv-track">
    <path class="cv-stroke" d="M772 260H512A252 252 0 0 0 260 512V764H864"/>
    <circle cx="772" cy="260" r="100" fill="url(#cv-spin-flux)"/>
  </g>
  <path class="cv-stroke cv-runner" pathLength="1000" d="M772 260H512A252 252 0 0 0 260 512V764H864"/>
  <circle class="cv-seed" cx="772" cy="260" r="100" fill="url(#cv-spin-flux)"/>
</svg>
