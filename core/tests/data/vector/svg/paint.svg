<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="120">
  <defs>
    <linearGradient id="lin"><stop offset="0" stop-color="red"/><stop offset="0.5" stop-color="yellow" stop-opacity="0.8"/><stop offset="1" stop-color="blue"/></linearGradient>
    <linearGradient id="lin2" xlink:href="#lin" x1="0" y1="0" x2="20" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect"/>
    <linearGradient id="lin3" xlink:href="#lin" gradientTransform="rotate(90 0.5 0.5)" spreadMethod="repeat" x2="0.5"/>
    <radialGradient id="rad" cx="0.5" cy="0.5" r="0.5" fx="0.3" fy="0.3"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="#004"/></radialGradient>
    <pattern id="pat" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#f80"/><circle cx="7.5" cy="7.5" r="2.5" fill="#08f"/></pattern>
  </defs>
  <rect x="5" y="5" width="90" height="50" fill="url(#lin)"/>
  <rect x="105" y="5" width="90" height="50" fill="url(#lin2)"/>
  <rect x="5" y="65" width="60" height="50" fill="url(#lin3)"/>
  <circle cx="100" cy="90" r="25" fill="url(#rad)"/>
  <rect x="135" y="65" width="60" height="50" fill="url(#pat)" stroke="url(#lin)" stroke-width="3"/>
</svg>
