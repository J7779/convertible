# Continuous integration for every push and pull request.
#
# Jobs: core (GCC 14, Clang 18 + ASan/UBSan, Apple Clang, MSVC), web (WebAssembly build in
# the pinned Emscripten container, Node tests, end-to-end), android (build, unit tests,
# lint; instrumented tests on an emulator nightly or on demand), desktop (Linux, macOS,
# Windows: tests and packages) and hygiene (privacy audit, generated files, workflow lint).
#
# There is no iOS job on purpose: building and testing the iOS app on a hosted runner is
# possible, but anything worth shipping needs the owner's signing certificate, which is
# never stored in this repository or its secrets. Run the iOS tests locally (see
# apps/ios/README.md and docs/TESTING.md).
#
# Only GitHub's own actions are used, pinned to full commit SHAs. Everything else is a
# shell step calling tools/ci/*, which also run locally (tools/ci/docker-linux.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: adds the Android instrumented tests
  workflow_dispatch:
    inputs:
      android_device_tests:
        description: Run the Android instrumented and end-to-end tests on an emulator
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CVT_JOBS: "4"

jobs:
  # ---------------------------------------------------------------------------------------
  core-linux:
    name: core / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc14
            deps: gcc
            preset: dev
            cc: gcc-14
            cxx: g++-14
            cxxflags: ""
            ldflags: ""
            asan_extra: ""
          - name: linux-clang18-asan
            deps: clang
            preset: asan
            cc: clang-18
            cxx: clang++-18
            cxxflags: -stdlib=libc++
            ldflags: -stdlib=libc++
            # Ubuntu's shared libc++/libc++abi 18 allocate and free std::runtime_error's
            # message with mismatched functions; see tools/ci/core.sh.
            asan_extra: alloc_dealloc_mismatch=0
    env:
      CVT_ASAN_EXTRA_OPTIONS: ${{ matrix.asan_extra }}
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CXXFLAGS: ${{ matrix.cxxflags }}
      LDFLAGS: ${{ matrix.ldflags }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/../ccache
      CCACHE_MAXSIZE: 2G
      ASAN_SYMBOLIZER_PATH: /usr/lib/llvm-18/bin/llvm-symbolizer # readable sanitizer stacks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: tools/ci/install-linux-deps.sh ${{ matrix.deps }} ccache
      - name: Compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/../ccache
          key: ccache-${{ matrix.name }}-${{ hashFiles('core/**', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: ccache-${{ matrix.name }}-
      - name: Build and test (${{ matrix.preset }})
        run: tools/ci/core.sh ${{ matrix.preset }}
      - name: Formats documentation is current
        if: matrix.preset == 'dev'
        run: python3 tools/gen-formats-doc --check --cli build/${{ matrix.preset }}/core/convertible
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ matrix.name }}
          path: build/*/Testing/Temporary/
          if-no-files-found: ignore

  core-macos:
    name: core / macos-appleclang
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test (dev)
        run: tools/ci/core.sh dev
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-macos
          path: build/*/Testing/Temporary/
          if-no-files-found: ignore

  core-windows:
    name: core / windows-msvc
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      # Long paths for deep fixture trees; LF checkouts so sources and generated files
      # match the other platforms byte for byte (fixtures are -text and never converted).
      - name: Configure git
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test (dev, Visual Studio generator, /W4)
        run: tools/ci/core.sh dev
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-windows
          path: build/*/Testing/Temporary/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CVT_DOCKER_MEMORY: 12g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Emscripten system-library cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/build/emcache
          key: emcache-${{ hashFiles('apps/web/build.sh', 'apps/web/CMakeLists.txt') }}
      - name: Build (pinned Emscripten container)
        run: apps/web/build.sh --docker
      - name: Unit tests
        run: apps/web/test.sh
      - name: End-to-end tests
        run: |
          if [[ -f apps/web/e2e.sh ]]; then
            # The runner's preinstalled Chrome; fail rather than skip when it is missing.
            CHROME_BIN="$(command -v google-chrome || command -v chromium || true)" \
              E2E_REQUIRE_BROWSER=1 bash apps/web/e2e.sh
          else
            echo "apps/web/e2e.sh is not in this checkout; skipped"
          fi
      - name: Upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 14

  # ---------------------------------------------------------------------------------------
  android:
    name: android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-android
      - name: Build, unit tests and lint
        working-directory: apps/android
        run: ./gradlew --no-daemon --max-workers=4 -Pconvertible.nativeJobs=4 assembleDebug assembleRelease testDebugUnitTest lint
      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apks
          path: apps/android/app/build/outputs/apk/
          retention-days: 14
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: apps/android/app/build/reports/
          if-no-files-found: ignore

  android-device:
    name: android / emulator
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.android_device_tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/setup-android
        with:
          emulator: "true"
      - name: Build test APKs (x86_64 only)
        working-directory: apps/android
        run: ./gradlew --no-daemon --max-workers=4 -Pconvertible.abis=x86_64 -Pconvertible.nativeJobs=4 assembleDebug assembleDebugAndroidTest
      - name: Boot emulator
        run: |
          tools/ci/android-emulator.sh create
          tools/ci/android-emulator.sh boot
          tools/ci/android-emulator.sh wait
      - name: Instrumented tests
        working-directory: apps/android
        run: ./gradlew --no-daemon --max-workers=4 -Pconvertible.abis=x86_64 -Pconvertible.nativeJobs=4 connectedDebugAndroidTest
      - name: End-to-end tests
        run: |
          if [[ -f apps/android/e2e.sh ]]; then
            bash apps/android/e2e.sh
          else
            echo "apps/android/e2e.sh is not in this checkout; skipped"
          fi
      - name: Stop emulator
        if: always()
        run: tools/ci/android-emulator.sh shutdown
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-device-reports
          path: apps/android/app/build/reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------
  desktop:
    name: desktop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure git
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain and X11 headers
        if: runner.os == 'Linux' && hashFiles('apps/desktop/CMakeLists.txt') != ''
        run: |
          tools/ci/install-linux-deps.sh desktop
          {
            echo "CC=gcc-14"
            echo "CXX=g++-14"
          } >> "${GITHUB_ENV}"
      - name: Build, test and package
        if: hashFiles('apps/desktop/CMakeLists.txt') != ''
        run: tools/ci/desktop.sh
      - name: Upload packages
        if: hashFiles('apps/desktop/CMakeLists.txt') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          path: |
            build/desktop/packages/*.zip
            build/desktop/packages/*.tar.gz
            build/desktop/packages/*.deb
          retention-days: 14
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-test-output-${{ runner.os }}
          path: |
            build/desktop/Testing/Temporary/
            build/desktop/apps/desktop/automation-smoke/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------
  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the privacy audit reads every commit
      - name: Privacy audit (tree and history)
        run: python3 tools/privacy-audit --history
      - name: Skills mirror is current
        run: python3 tools/sync-skills --check
      - name: Third-party notices are current
        run: python3 tools/gen-notices --check
      - name: Shell scripts parse
        run: for f in tools/ci/*.sh; do bash -n "$f"; done
      - name: Workflow lint (actionlint)
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
