<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="cv-intro-title">
  <title id="cv-intro-title">Convertible</title>
  <defs>
    <linearGradient id="cv-intro-flux" gradientUnits="userSpaceOnUse" x1="0" y1="360" x2="0" y2="664">
      <stop offset="0" stop-color="#7C6CFF"/>
      <stop offset="0.5" stop-color="#D662B0"/>
      <stop offset="1" stop-color="#FF6452"/>
    </linearGradient>
  </defs>
  <style>
    /* Intro, 1800 ms, plays once and ends on the static logo. Storyboard: animation.json */
    .cv-stroke { fill: none; stroke: url(#cv-intro-flux); stroke-width: 200; stroke-linecap: butt; stroke-linejoin: miter; stroke-dasharray: 1000 1000; }
    .cv-ripple-round, .cv-ripple-square, .cv-ghost { opacity: 0; }
    .cv-stage { transform-origin: 512px 512px; animation: cv-intro-stage-transform 1800ms both; }
    .cv-ripple-round { transform-origin: 772px 260px; animation: cv-intro-ripple-round-transform 1800ms both, cv-intro-ripple-round-opacity 1800ms both; }
    .cv-ripple-square { transform-origin: 764px 764px; animation: cv-intro-ripple-square-transform 1800ms both, cv-intro-ripple-square-opacity 1800ms both; }
    .cv-ghost { animation: cv-intro-ghost-trim 1800ms both, cv-intro-ghost-opacity 1800ms both; }
    .cv-trace { animation: cv-intro-trace-trim 1800ms both; }
    .cv-seed { transform-origin: 772px 260px; animation: cv-intro-seed-transform 1800ms both, cv-intro-seed-opacity 1800ms both; }
    @keyframes cv-intro-stage-transform {
      0% { transform: rotate(-8deg) scale(0.86); animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1); }
      66.6667% { transform: rotate(0deg) scale(1); animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
      75% { transform: rotate(0deg) scale(1.03); animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
      100% { transform: rotate(0deg) scale(1); }
    }
    @keyframes cv-intro-ripple-round-transform {
      0% { transform: scale(1); }
      3.3333% { transform: scale(1); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
      33.3333% { transform: scale(2.1); }
      100% { transform: scale(2.1); }
    }
    @keyframes cv-intro-ripple-round-opacity {
      0% { opacity: 0; }
      3.3333% { opacity: 0; animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
      6.6667% { opacity: 0.4; animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
      33.3333% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes cv-intro-ripple-square-transform {
      0% { transform: scale(1); }
      65.5556% { transform: scale(1); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
      95.5556% { transform: scale(1.6); }
      100% { transform: scale(1.6); }
    }
    @keyframes cv-intro-ripple-square-opacity {
      0% { opacity: 0; }
      65.5556% { opacity: 0; animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
      68.3333% { opacity: 0.45; animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
      95.5556% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes cv-intro-ghost-trim {
      0% { stroke-dasharray: 0 1000; stroke-dashoffset: 0; }
      6.6667% { stroke-dasharray: 0 1000; stroke-dashoffset: 0; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
      50% { stroke-dasharray: 1000 1000; stroke-dashoffset: 0; }
      100% { stroke-dasharray: 1000 1000; stroke-dashoffset: 0; }
    }
    @keyframes cv-intro-ghost-opacity {
      0% { opacity: 0.26; }
      55.5556% { opacity: 0.26; animation-timing-function: cubic-bezier(0.2, 0, 0, 1); }
      72.2222% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes cv-intro-trace-trim {
      0% { stroke-dasharray: 0 1000; stroke-dashoffset: 0; }
      14.4444% { stroke-dasharray: 0 1000; stroke-dashoffset: 0; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
      68.8889% { stroke-dasharray: 1000 1000; stroke-dashoffset: 0; }
      100% { stroke-dasharray: 1000 1000; stroke-dashoffset: 0; }
    }
    @keyframes cv-intro-seed-transform {
      0% { transform: scale(0); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
      21.1111% { transform: scale(1); }
      100% { transform: scale(1); }
    }
    @keyframes cv-intro-seed-opacity {
      0% { opacity: 0; animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
      6.6667% { opacity: 1; }
      100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cv-stage, .cv-ripple-round, .cv-ripple-square, .cv-ghost, .cv-trace, .cv-seed { animation: none; }
    }
  </style>
  <g class="cv-stage">
    <circle class="cv-ripple-round" cx="772" cy="260" r="100" fill="#7C6CFF"/>
    <rect class="cv-ripple-square" x="664" y="664" width="200" height="200" fill="#FF6452"/>
    <path class="cv-stroke cv-ghost" pathLength="1000" d="M772 260H512A252 252 0 0 0 260 512V764H864"/>
    <path class="cv-stroke cv-trace" pathLength="1000" d="M772 260H512A252 252 0 0 0 260 512V764H864"/>
    <circle class="cv-seed" cx="772" cy="260" r="100" fill="url(#cv-intro-flux)"/>
  </g>
</svg>
